# QuickJoiner eval set — authored against the real AppRiver workspace (2026-07-23), per
# docs/plans/05-eval-on-connected-org.md. Every id/uri/keyword below is a real entity or
# document discovered from the connected corpus (git:Connector/Nautical/Stevedore, TFS
# Appriver, Appriver Confluence, Appriver Octopus) via the knowledge graph — not placeholders.
#
# Run with: qj eval docs/evals/multi-hop-crosssource.yaml [--agent]
#
# Coverage: single-source facts, cross-repo dependency chains (deps.py), a ticket->code
# relationship surfaced by LLM triple extraction (graph.extract_triples), runtime pub/sub
# coupling (pubsub.py — the cross-repo edge deps.py alone can't see), Octopus deployment
# facts, a code-structural symbol lookup, cross-source aliasing (`aka`), person/team-role
# facts (relation-shaped questions of the kind graph.extract_triples' org-chart layer
# targets, but answerable here from plain-text Confluence charters with no LLM extraction
# needed), and genuine refusal cases (topics never ingested).
#
# Expanded 2026-07-29 per docs/plans/05-eval-on-connected-org.md ("expand refusal cases
# past 4, below CALIBRATION_MIN_CASES=10"): 8 new refusal cases + 3 new answerable cases
# (incl. 2 relation-shaped person/team questions), verified against the real connected
# workspace's retrieval layer before being added (see the plan doc for the verification
# transcript — several plausible-looking refusal candidates, e.g. employee health-benefits
# questions, were REJECTED because the corpus turned out to genuinely contain adjacent
# HR/Confluence content and would have been false refusal cases). 14 refusal / 20
# answerable = 34 cases, a higher refusal ratio than the original ~20% guideline —
# deliberate, to clear CALIBRATION_MIN_CASES with margin.
name: multi-hop-crosssource
cases:
  - id: connector-nautical-dependency
    question: Does the Connector repository depend on Nautical, and through which package?
    expect:
      uris: ["Connector"]
      keywords: ["AppRiver.Nautical.Client"]
      hops: ["Connector", "Nautical"]

  - id: stevedore-nautical-dependency
    question: What Nautical packages does the Stevedore repository depend on?
    expect:
      uris: ["Stevedore"]
      keywords: ["AppRiver.Nautical.Client", "AppRiver.Nautical.DataContracts"]
      hops: ["Stevedore", "Nautical"]

  - id: connector-octopus-environments
    question: What environments is AppRiver.Connector deployed to in Octopus?
    expect:
      uris: ["Connector", "dashboard"]
      keywords: ["DevLab", "Production", "Staging"]
      hops: ["Connector", "Octopus"]

  - id: webroot-connector-alias
    question: What repository is also known as the Webroot Connector?
    expect:
      uris: ["Connector"]
      keywords: ["Connector"]

  - id: connector-nautical-pubsub
    question: How do the Connector and Nautical services communicate with each other at runtime - what message topic do they share?
    expect:
      uris: ["Connector"]
      keywords: ["prov_svc"]
      hops: ["Connector", "Nautical"]

  - id: ticket-logging-spike-repos
    question: "Which repositories does TFS ticket #280647 (the Black Team logging SPIKE) call out as using an old version of AppRiver.Core.Logging?"
    expect:
      uris: ["280647"]
      keywords: ["AppRiver.Core.Logging", "SecureTide"]

  - id: connector-core-package-deps
    question: What AppRiver.Core packages does the Connector repository depend on?
    expect:
      uris: ["Connector"]
      keywords: ["AppRiver.Core.Logging", "AppRiver.Core.Security"]

  - id: mxchecker-octopus-project
    question: Is there an Octopus deployment project for AppRiver.SecureTide.MXChecker?
    expect:
      uris: ["MXChecker"]
      keywords: ["MXChecker"]

  - id: nautical-octopus-projects
    question: What Octopus deployment projects exist for Nautical-related services?
    expect:
      uris: ["Nautical"]
      keywords: ["Nautical"]

  - id: ticket-hpul-domain-filter
    question: "What is TFS work item #120875 about?"
    expect:
      uris: ["120875"]
      keywords: ["HPUL", "domain"]

  - id: ticket-domain-search-filtering
    question: "What is TFS work item #120969 about?"
    expect:
      uris: ["120969"]
      keywords: ["domain search", "filtering"]

  # Team composition from a DEVKB charter. This is a tracked FALSE-REFUSAL case: the
  # Honeypots charter is retrieval's #1 hit for this question but scores ~0.47 cosine,
  # under the 0.55 gate, so the agent wrongly refuses (found live 2026-07-23 debugging
  # "composition of team Caffeine"). Honeypots is used (not Caffeine) because its members
  # are plain-text and already in memory; Caffeine listed members via @user-mentions that
  # the storage-format extraction dropped — fixed by the body.view switch, but needs a
  # Confluence re-sync to re-ingest. This case is the signal for whether a stronger
  # embedding / threshold retune rescues sub-gate top hits (the deferred embedding decision).
  - id: honeypots-team-composition
    question: Who are the members of team Honeypots and what are their roles?
    expect:
      uris: ["Honeypots"]
      keywords: ["Kasper Vervaecke", "Karen Rockwell"]

  - id: confluence-securetide-integration
    question: What does the SecureTide Integration page in Confluence describe?
    expect:
      uris: ["SecureTide Integration"]

  - id: confluence-architecture-decisions
    question: Where can I find architectural decision records for AppRiver?
    expect:
      uris: ["Architectural Decision Records"]

  - id: connector-symbol-location
    question: Which repository defines the AddCustomersToCartRequestFactory class?
    expect:
      uris: ["Connector"]
      keywords: ["Connector"]

  - id: charges-api-octopus-project
    question: Is there an Octopus deployment project for Charges.Api?
    expect:
      uris: ["Charges.Api"]
      keywords: ["Charges.Api"]

  - id: stevedore-alias
    question: What is the Stevedore repository also known as?
    expect:
      uris: ["Stevedore"]
      keywords: ["Provisioning"]

  # Relation-shaped person/team questions (added 2026-07-29): the shape of fact the
  # C4 (graph.extract_triples) leg's org-chart layer mostly builds, but answerable
  # here straight from a plain-text Confluence team charter — no LLM triple
  # extraction needed. Verified live: rank 1, score 0.76/0.75/0.66 respectively.
  - id: mailrakshak-team-composition
    question: Who are the members of the MailRakshak team and what are their roles?
    expect:
      uris: ["MailRakshak"]
      keywords: ["Shalini M", "Catherine Kingeter"]

  - id: nextgen-team-services
    question: What services does the NextGen team own and support?
    expect:
      uris: ["Next Gen"]
      keywords: ["Microsoft", "HEX"]

  - id: nextgen-scrum-master
    question: Who is the Scrum Master for the NextGen team?
    expect:
      uris: ["Next Gen"]
      keywords: ["Priyanka Khatri"]

  - id: unlearned-k8s-budget-2028
    question: What is the Kubernetes infrastructure cost budget approved for Q3 2028?
    expect:
      refusal: true

  - id: unlearned-competitor-pricing
    question: What pricing does Mimecast charge for their competing email security product?
    expect:
      refusal: true

  - id: unlearned-connector-2028-roadmap
    question: What features are planned for the Connector service roadmap in 2028?
    expect:
      refusal: true

  - id: unlearned-employee-pto-balance
    question: "How many PTO days does employee badge #88421 have remaining this quarter?"
    expect:
      refusal: true

  # 8 more refusal cases added 2026-07-29 (docs/plans/05-eval-on-connected-org.md,
  # "expand refusal cases past 4"). Each verified against the real connected corpus
  # (retrieval layer, min_score=0.0) before inclusion — every one of them, LIKE THE
  # FOUR ABOVE, has a topically-adjacent near-miss scoring 0.6-0.8 cosine (general
  # corporate/security/dev vocabulary overlap with no genuine answer), confirming
  # this corpus-wide, not case-specific: with the IVF_PQ refine_factor fix applied
  # (true cosines), NONE of these 12 refusal cases clear even a conservatively-raised
  # min_score without also catching real answerable hits in the same range — the
  # "refusal discrimination" gap PRIORITIES #36 already flagged, now measured on 12
  # cases instead of 4. Candidates that turned out to have real adjacent content in
  # the corpus (e.g. employee benefits — Confluence has a real "Benefits transition"
  # page) were deliberately NOT used, to avoid manufacturing false refusal cases.
  - id: unlearned-soc2-audit-finding-fy2029
    question: "What SOC 2 Type II audit finding number was reported for AppRiver in the FY2029 audit?"
    expect:
      refusal: true

  - id: unlearned-engineer-raise-percentage-2029
    question: "What raise percentage will engineers receive in the 2029 performance review cycle?"
    expect:
      refusal: true

  - id: unlearned-broadcom-email-security-pricing
    question: "What is Broadcom's list price for their competing email security gateway product?"
    expect:
      refusal: true

  - id: unlearned-pentest-report-2029
    question: "What penetration test finding was reported by the external pentest vendor in the March 2029 report?"
    expect:
      refusal: true

  - id: unlearned-vc-funding-round
    question: "Which venture capital firm led AppRiver's most recent funding round?"
    expect:
      refusal: true

  - id: unlearned-bug-bounty-cve-2029
    question: "What was the exact bug bounty payout awarded for CVE-2029-41892?"
    expect:
      refusal: true

  - id: unlearned-zscaler-eps-q1-2027
