<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickJoiner</title>
<style>
  /* ============================================================
     QuickJoiner — "knowledge console"
     Dark-first. Teal = the live agent. Gold = the provenance seal
     (citations + grounded answers). Violet = the honest "not learned"
     state. Slate surfaces layer to give the tool depth and weight.
     ============================================================ */
  :root {
    --bg:#0C1115; --surface:#121A1F; --raised:#18222A; --raised-2:#1F2B33;
    --border:#25333B; --border-soft:#1E2A31; --hair:#2C3B44;
    --text:#E9EFEC; --muted:#93A39E; --faint:#61716D;
    --accent:#37C6B4; --accent-hi:#5FDccb; --accent-ink:#05130F; --accent-soft:#37C6B41C;
    --gold:#DDAB55; --gold-hi:#EDC079; --gold-soft:#DDAB5518; --gold-line:#DDAB5540;
    --unknown:#A18DE6; --unknown-soft:#A18DE618;
    --danger:#E6715E; --danger-soft:#E6715E18;
    --shadow:0 18px 46px -20px rgba(0,0,0,.66);
    --shadow-sm:0 8px 22px -14px rgba(0,0,0,.6);
    --mono:"Cascadia Code","Cascadia Mono",ui-monospace,"SF Mono",Consolas,monospace;
    --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    --display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    --r:12px; --r-sm:8px; --r-xs:5px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#EEF2F1; --surface:#FBFCFB; --raised:#FFFFFF; --raised-2:#F4F7F6;
      --border:#DCE4E2; --border-soft:#E5EBEA; --hair:#D2DCDA;
      --text:#16211D; --muted:#5C6C68; --faint:#8A9995;
      --accent:#0E9C8B; --accent-hi:#0BB39F; --accent-ink:#FFFFFF; --accent-soft:#0E9C8B14;
      --gold:#B27C1F; --gold-hi:#9C6C15; --gold-soft:#B27C1F14; --gold-line:#B27C1F3A;
      --unknown:#6A52C0; --unknown-soft:#6A52C012;
      --danger:#C4462F; --danger-soft:#C4462F12;
      --shadow:0 18px 40px -22px rgba(31,45,42,.28);
      --shadow-sm:0 8px 20px -14px rgba(31,45,42,.24);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0C1115; --surface:#121A1F; --raised:#18222A; --raised-2:#1F2B33;
    --border:#25333B; --border-soft:#1E2A31; --hair:#2C3B44;
    --text:#E9EFEC; --muted:#93A39E; --faint:#61716D;
    --accent:#37C6B4; --accent-hi:#5FDccb; --accent-ink:#05130F; --accent-soft:#37C6B41C;
    --gold:#DDAB55; --gold-hi:#EDC079; --gold-soft:#DDAB5518; --gold-line:#DDAB5540;
    --unknown:#A18DE6; --unknown-soft:#A18DE618;
    --danger:#E6715E; --danger-soft:#E6715E18;
    --shadow:0 18px 46px -20px rgba(0,0,0,.66); --shadow-sm:0 8px 22px -14px rgba(0,0,0,.6);
  }
  :root[data-theme="light"] {
    --bg:#EEF2F1; --surface:#FBFCFB; --raised:#FFFFFF; --raised-2:#F4F7F6;
    --border:#DCE4E2; --border-soft:#E5EBEA; --hair:#D2DCDA;
    --text:#16211D; --muted:#5C6C68; --faint:#8A9995;
    --accent:#0E9C8B; --accent-hi:#0BB39F; --accent-ink:#FFFFFF; --accent-soft:#0E9C8B14;
    --gold:#B27C1F; --gold-hi:#9C6C15; --gold-soft:#B27C1F14; --gold-line:#B27C1F3A;
    --unknown:#6A52C0; --unknown-soft:#6A52C012;
    --danger:#C4462F; --danger-soft:#C4462F12;
    --shadow:0 18px 40px -22px rgba(31,45,42,.28); --shadow-sm:0 8px 20px -14px rgba(31,45,42,.24);
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
         font-size:15px; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
         min-height:100%; }
  ::selection { background:var(--accent-soft); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  button { font-family:inherit; }
  svg { display:block; }
  .ico { width:16px; height:16px; stroke:currentColor; stroke-width:1.8; fill:none;
         stroke-linecap:round; stroke-linejoin:round; }

  /* ---- top bar ------------------------------------------------ */
  .topbar { display:flex; align-items:center; gap:16px; height:56px; padding:0 20px;
            border-bottom:1px solid var(--border); background:var(--surface);
            position:sticky; top:0; z-index:6; }
  .brand { display:flex; align-items:center; gap:11px; font-family:var(--mono); font-weight:600;
           letter-spacing:.2em; text-transform:uppercase; font-size:13.5px; }
  .brand-dot { width:11px; height:11px; border-radius:50%; background:var(--accent);
               box-shadow:0 0 0 4px var(--accent-soft); position:relative; }
  .brand-dot::after { content:""; position:absolute; inset:3px; border-radius:50%;
               background:var(--bg); opacity:.35; }
  .org-tag { font-family:var(--mono); font-size:11.5px; color:var(--muted); letter-spacing:.06em;
             padding:3px 9px; border:1px solid var(--border); border-radius:100px; }
  .model-tag { font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:.02em;
               display:inline-flex; align-items:center; gap:6px; }
  .model-tag::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .top-actions { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .icon-btn { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px;
              border-radius:var(--r-sm); border:1px solid var(--border); background:var(--raised);
              color:var(--muted); cursor:pointer; transition:.15s; }
  .icon-btn:hover { color:var(--text); border-color:var(--hair); background:var(--raised-2); }

  /* ---- app grid ---------------------------------------------- */
  .app { flex:1; display:grid; grid-template-columns:296px 1fr; min-height:0; }

  /* ---- left rail --------------------------------------------- */
  .rail { border-right:1px solid var(--border); background:var(--surface);
          overflow-y:auto; padding:18px 16px 26px; display:flex; flex-direction:column; gap:22px; }
  .memory { background:var(--raised); border:1px solid var(--border-soft); border-radius:var(--r);
            padding:14px 15px; }
  .memory .m-label { font-family:var(--mono); font-size:9.5px; letter-spacing:.18em;
            text-transform:uppercase; color:var(--faint); }
  .memory .m-nums { display:flex; align-items:baseline; gap:5px; margin-top:8px; flex-wrap:wrap; }
  .memory .m-big { font-family:var(--mono); font-size:26px; font-weight:600; color:var(--text);
            letter-spacing:-.01em; line-height:1; font-variant-numeric:tabular-nums; }
  .memory .m-unit { font-size:12px; color:var(--muted); }
  .memory .m-sub { margin-top:9px; font-size:12px; color:var(--muted); display:flex; gap:6px;
            align-items:center; }
  .memory .m-sub .sourcecount { color:var(--gold); font-family:var(--mono);
            font-variant-numeric:tabular-nums; }

  .rail-sec { display:flex; flex-direction:column; gap:10px; }
  .eyebrow { font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
             color:var(--faint); display:flex; align-items:center; gap:8px; }
  .eyebrow .link { margin-left:auto; color:var(--accent); cursor:pointer; text-transform:none;
             letter-spacing:.02em; font-size:11px; background:none; border:none; padding:0;
             display:inline-flex; align-items:center; gap:4px; }
  .eyebrow .link:hover { color:var(--accent-hi); }

  .select-wrap { position:relative; }
  .select-wrap select { width:100%; appearance:none; background:var(--raised); color:var(--text);
             border:1px solid var(--border); border-radius:var(--r-sm); padding:9px 32px 9px 12px;
             font-family:var(--sans); font-size:13px; cursor:pointer; }
  .select-wrap::after { content:""; position:absolute; right:13px; top:50%; width:7px; height:7px;
             border-right:1.6px solid var(--muted); border-bottom:1.6px solid var(--muted);
             transform:translateY(-70%) rotate(45deg); pointer-events:none; }
  .mini-form { display:flex; gap:6px; }
  .mini-input { flex:1; background:var(--raised); color:var(--text); border:1px solid var(--border);
             border-radius:var(--r-sm); padding:8px 11px; font-size:12.5px; font-family:var(--sans); }
  .mini-input::placeholder { color:var(--faint); }

  .chip-btn { font-size:12px; background:var(--raised); border:1px solid var(--border);
             color:var(--muted); border-radius:var(--r-sm); padding:8px 12px; cursor:pointer;
             transition:.15s; display:inline-flex; align-items:center; gap:7px; justify-content:center; }
  .chip-btn:hover { border-color:var(--accent); color:var(--accent); }
  .chip-btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink);
             font-weight:600; }
  .chip-btn.primary:hover { background:var(--accent-hi); border-color:var(--accent-hi); }
  .chip-btn.full { width:100%; }
  .chip-btn:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:7px; }

  .chat-item { border:1px solid transparent; border-left:2px solid transparent; padding:8px 10px;
             border-radius:var(--r-xs); cursor:pointer; transition:.12s; }
  .chat-item:hover { background:var(--raised); }
  .chat-item.active { background:var(--raised); border-left-color:var(--accent); }
  .chat-item .ci-t { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chat-item .ci-m { font-family:var(--mono); font-size:10px; color:var(--faint); margin-top:3px;
             font-variant-numeric:tabular-nums; }
  .chat-item .ci-m .proj { color:var(--gold); }

  .sys-item { display:flex; align-items:center; gap:9px; padding:7px 4px; border-radius:var(--r-xs); }
  .sys-item:hover { background:var(--raised); }
  .sys-dot { width:7px; height:7px; border-radius:50%; background:var(--gold);
             box-shadow:0 0 0 3px var(--gold-soft); flex-shrink:0; }
  .sys-item .s-name { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sys-item .s-meta { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--faint);
             flex-shrink:0; font-variant-numeric:tabular-nums; }
  .hint { font-size:12.5px; color:var(--muted); line-height:1.55; }
  .hint code { font-family:var(--mono); font-size:11px; color:var(--text);
             background:var(--raised); padding:1px 5px; border-radius:4px; }

  /* ---- canvas ------------------------------------------------- */
  .canvas { display:flex; flex-direction:column; min-width:0; position:relative; }
  .thread { flex:1; overflow-y:auto; padding:30px 30px 14px; scroll-behavior:smooth; }
  .thread-inner { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:26px; }

  .msg { display:flex; gap:15px; }
  .avatar { width:30px; height:30px; border-radius:9px; flex-shrink:0; display:flex;
            align-items:center; justify-content:center; font-family:var(--mono); font-size:10px;
            font-weight:700; letter-spacing:.02em; }
  .msg.user .avatar { background:var(--raised-2); color:var(--muted); border:1px solid var(--border); }
  .msg.agent .avatar { background:var(--accent-soft); color:var(--accent);
            border:1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
  .msg-body { min-width:0; flex:1; padding-top:3px; }
  .msg .who { font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
            color:var(--faint); margin-bottom:7px; display:flex; align-items:center; gap:9px; }
  .msg.agent .who { color:var(--accent); }
  .msg .ts { color:var(--faint); font-size:10px; letter-spacing:.06em; }
  .user-text { background:var(--raised); border:1px solid var(--border-soft); border-radius:var(--r);
            padding:11px 15px; white-space:pre-wrap; line-height:1.5; font-size:14.5px; }

  /* grounded-answer treatment: the gold seal is the signature */
  .answer { font-size:15px; line-height:1.68; white-space:pre-wrap; overflow-wrap:break-word;
            padding-left:16px; border-left:2px solid var(--gold-line); }
  .answer.streaming { border-left-color:var(--accent);
            animation:pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 50% { border-left-color:color-mix(in srgb,var(--accent) 35%,transparent); } }
  .answer.refused { border-left-color:var(--unknown); color:var(--text); }
  .grounded-tag { display:inline-flex; align-items:center; gap:6px; font-family:var(--mono);
            font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold);
            border:1px solid var(--gold-line); background:var(--gold-soft); padding:2px 8px;
            border-radius:100px; }
  .refused-tag { color:var(--unknown); border-color:color-mix(in srgb,var(--unknown) 34%,transparent);
            background:var(--unknown-soft); }

  /* inline citations = provenance chips */
  .cite { display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px;
            color:var(--gold); background:var(--gold-soft); border:1px solid var(--gold-line);
            border-radius:100px; padding:1px 9px 1px 3px; max-width:340px; vertical-align:baseline;
            text-decoration:none; transition:.14s; }
  a.cite:hover { background:color-mix(in srgb,var(--gold) 20%,transparent); color:var(--gold-hi); }
  .cite .cn { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px;
            border-radius:50%; background:var(--gold); color:var(--bg); font-weight:700; font-size:9.5px;
            flex-shrink:0; }
  .cite .ct { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* thinking + tool activity */
  details.think { margin:0 0 12px; border:1px solid var(--border-soft); border-radius:var(--r-sm);
            background:var(--surface); overflow:hidden; }
  details.think summary { font-family:var(--mono); font-size:10px; letter-spacing:.16em;
            text-transform:uppercase; color:var(--muted); cursor:pointer; list-style:none;
            padding:8px 12px; display:flex; align-items:center; gap:8px; }
  details.think summary::-webkit-details-marker { display:none; }
  details.think summary::before { content:""; width:6px; height:6px; border-right:1.5px solid currentColor;
            border-bottom:1.5px solid currentColor; transform:rotate(-45deg); transition:.15s; }
  details.think[open] summary::before { transform:rotate(45deg); }
  details.think pre { font-family:var(--mono); font-size:11.5px; color:var(--muted); line-height:1.5;
            white-space:pre-wrap; margin:0; padding:0 12px 11px; max-height:150px; overflow-y:auto; }
  .tools { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:11px; }
  .toolchip { font-family:var(--mono); font-size:10px; letter-spacing:.02em; color:var(--muted);
            background:var(--surface); border:1px solid var(--border); border-radius:100px;
            padding:3px 10px 3px 8px; display:inline-flex; align-items:center; gap:6px;
            max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toolchip::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--accent);
            flex-shrink:0; }

  details.memo { background:var(--accent-soft); border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
            border-radius:var(--r-sm); padding:9px 13px; }
  details.memo summary { font-family:var(--mono); font-size:10px; letter-spacing:.14em;
            text-transform:uppercase; color:var(--accent); cursor:pointer; list-style:none; }
  details.memo summary::-webkit-details-marker { display:none; }
  details.memo pre { font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:pre-wrap;
            margin:9px 0 2px; line-height:1.55; }
  .msg.error .answer { border-left-color:var(--danger); color:var(--danger); font-family:var(--mono);
            font-size:13px; }

  /* ---- onboarding / empty states ----------------------------- */
  .empty { max-width:600px; margin:6vh auto 0; text-align:left; }
  .empty .badge { display:inline-flex; align-items:center; gap:8px; font-family:var(--mono);
            font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent);
            border:1px solid color-mix(in srgb,var(--accent) 30%,transparent); background:var(--accent-soft);
            padding:4px 11px; border-radius:100px; }
  .empty h1 { font-family:var(--display); font-size:30px; line-height:1.18; font-weight:600;
            letter-spacing:-.015em; margin:18px 0 12px; }
  .empty h1 .gold { color:var(--gold); }
  .empty p { color:var(--muted); font-size:15px; line-height:1.62; margin:0 0 22px; max-width:520px; }
  .empty .cta-row { display:flex; gap:10px; flex-wrap:wrap; }
  .cta { display:inline-flex; align-items:center; gap:9px; background:var(--accent);
            color:var(--accent-ink); border:none; border-radius:var(--r-sm); padding:11px 18px;
            font-size:14px; font-weight:600; cursor:pointer; transition:.15s; }
  .cta:hover { background:var(--accent-hi); }
  .cta.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  .cta.ghost:hover { border-color:var(--hair); background:var(--raised); }
  .promises { margin-top:30px; display:grid; gap:14px; }
  .promise { display:flex; gap:12px; align-items:flex-start; }
  .promise .p-ic { width:30px; height:30px; border-radius:8px; display:flex; align-items:center;
            justify-content:center; flex-shrink:0; }
  .promise.g .p-ic { background:var(--gold-soft); color:var(--gold);
            border:1px solid var(--gold-line); }
  .promise.u .p-ic { background:var(--unknown-soft); color:var(--unknown);
            border:1px solid color-mix(in srgb,var(--unknown) 32%,transparent); }
  .promise.t .p-ic { background:var(--accent-soft); color:var(--accent);
            border:1px solid color-mix(in srgb,var(--accent) 32%,transparent); }
  .promise .p-t { font-size:13.5px; font-weight:600; }
  .promise .p-d { font-size:12.5px; color:var(--muted); line-height:1.5; margin-top:2px; }

  .starters { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
  .starter { font-size:13px; color:var(--muted); background:var(--raised); border:1px solid var(--border);
            border-radius:100px; padding:8px 14px; cursor:pointer; transition:.14s; }
  .starter:hover { border-color:var(--accent); color:var(--text); }

  /* ---- composer ---------------------------------------------- */
  .composer-wrap { padding:14px 30px 22px; }
  .composer { max-width:820px; margin:0 auto; display:flex; align-items:flex-end; gap:10px;
            background:var(--raised); border:1px solid var(--border); border-radius:var(--r);
            padding:10px 10px 10px 16px; box-shadow:var(--shadow-sm); transition:border-color .15s; }
  .composer:focus-within { border-color:color-mix(in srgb,var(--accent) 55%,transparent); }
  .composer textarea { flex:1; background:none; border:none; resize:none; color:var(--text);
            font-family:var(--sans); font-size:15px; line-height:1.5; max-height:180px; padding:6px 0;
            outline:none; }
  .composer textarea::placeholder { color:var(--faint); }
  .send { width:40px; height:40px; flex-shrink:0; border:none; border-radius:var(--r-sm);
            background:var(--accent); color:var(--accent-ink); cursor:pointer; display:flex;
            align-items:center; justify-content:center; transition:.15s; }
  .send:hover { background:var(--accent-hi); }
  .send:disabled { opacity:.4; cursor:default; }
  .send .ico { width:18px; height:18px; stroke-width:2; }
  .composer-note { max-width:820px; margin:9px auto 0; font-size:11px; color:var(--faint);
            text-align:center; letter-spacing:.01em; }
  .composer-note b { color:var(--gold); font-weight:600; }

  /* ---- settings drawer --------------------------------------- */
  #backdrop { position:fixed; inset:0; background:rgba(6,10,12,.55); opacity:0; pointer-events:none;
            transition:opacity .2s; z-index:8; backdrop-filter:blur(2px); }
  #backdrop.open { opacity:1; pointer-events:auto; }
  #drawer { position:fixed; top:0; right:0; bottom:0; width:min(468px,100vw); background:var(--surface);
            border-left:1px solid var(--border); z-index:9; transform:translateX(103%);
            transition:transform .24s cubic-bezier(.22,.85,.28,1); display:flex; flex-direction:column;
            box-shadow:var(--shadow); }
  #drawer.open { transform:none; }
  @media (prefers-reduced-motion:reduce) { #drawer,#backdrop,.thread { transition:none; scroll-behavior:auto; } }
  .drawer-head { display:flex; align-items:center; gap:11px; padding:16px 20px;
            border-bottom:1px solid var(--border); }
  .drawer-head .dh-ic { width:30px; height:30px; border-radius:8px; background:var(--accent-soft);
            color:var(--accent); display:flex; align-items:center; justify-content:center;
            border:1px solid color-mix(in srgb,var(--accent) 32%,transparent); }
  .drawer-head .t { font-family:var(--mono); font-size:12px; letter-spacing:.18em; text-transform:uppercase;
            font-weight:600; }
  .drawer-head .x { margin-left:auto; }
  .drawer-body { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:24px; }
  .drawer-status { font-family:var(--mono); font-size:11.5px; min-height:15px; padding:0; }
  .drawer-status.ok { color:var(--accent); }
  .drawer-status.err { color:var(--danger); }
  .sec-title { font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
            color:var(--faint); margin-bottom:12px; }

  .acct-card { background:var(--raised); border:1px solid var(--border-soft); border-radius:var(--r);
            padding:15px; }
  .acct-line { display:flex; align-items:center; gap:11px; }
  .acct-avatar { width:36px; height:36px; border-radius:10px; background:var(--accent-soft);
            color:var(--accent); display:flex; align-items:center; justify-content:center;
            font-family:var(--mono); font-weight:700; font-size:14px; text-transform:uppercase;
            border:1px solid color-mix(in srgb,var(--accent) 32%,transparent); }
  .acct-line .a-name { font-size:14px; font-weight:600; }
  .acct-line .a-sub { font-size:12px; color:var(--muted); margin-top:1px; }
  .acct-line .chip-btn { margin-left:auto; }

  .field { margin-bottom:11px; }
  .field label { display:block; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
            text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  .field input { width:100%; background:var(--raised); color:var(--text); border:1px solid var(--border);
            border-radius:var(--r-sm); padding:9px 11px; font-family:var(--mono); font-size:12.5px; }
  .field input::placeholder { color:var(--faint); }
  .field .fhint { font-size:11px; color:var(--faint); margin-top:4px; line-height:1.5; }
  .check { display:flex; gap:9px; align-items:flex-start; font-size:12.5px; color:var(--muted);
            margin:14px 0; line-height:1.45; }
  .check input { accent-color:var(--accent); margin-top:2px; width:15px; height:15px; }
  .btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .btn-row .chip-btn.danger { border-color:color-mix(in srgb,var(--danger) 50%,transparent);
            color:var(--danger); }
  .btn-row .chip-btn.danger:hover { background:var(--danger-soft); }
  details.disc summary { font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
            text-transform:uppercase; color:var(--muted); cursor:pointer; margin-top:12px;
            list-style:none; display:inline-flex; align-items:center; gap:7px; }
  details.disc summary::-webkit-details-marker { display:none; }
  details.disc summary::before { content:"+"; font-size:13px; }
  details.disc[open] summary::before { content:"–"; }
  details.disc[open] summary { margin-bottom:12px; }

  /* workspace settings form */
  .settings-form .subhead { font-family:var(--mono); font-size:10px; letter-spacing:.14em;
            text-transform:uppercase; color:var(--accent); margin:18px 0 11px;
            padding-bottom:6px; border-bottom:1px solid var(--border-soft); }
  .settings-form .subhead:first-child { margin-top:0; }
  .settings-form .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .settings-form select.fld { width:100%; background:var(--raised); color:var(--text);
            border:1px solid var(--border); border-radius:var(--r-sm); padding:9px 11px;
            font-family:var(--mono); font-size:12.5px; appearance:none; cursor:pointer; }
  .warn { font-size:11px; color:var(--gold); background:var(--gold-soft);
            border:1px solid var(--gold-line); border-radius:var(--r-sm); padding:9px 11px;
            margin:10px 0; line-height:1.5; }
  .warn b { color:var(--gold-hi); }
  .settings-form .save-bar { display:flex; align-items:center; gap:10px; margin-top:16px;
            padding-top:14px; border-top:1px solid var(--border-soft); }
  .settings-form .save-msg { font-family:var(--mono); font-size:11px; }
  .settings-form .save-msg.ok { color:var(--accent); } .settings-form .save-msg.err { color:var(--danger); }

  /* connector plates */
  .plate { background:var(--raised); border:1px solid var(--border-soft); border-radius:var(--r);
            padding:15px; margin-bottom:12px; }
  .plate-top { display:flex; align-items:center; gap:11px; }
  .plate-ic { width:34px; height:34px; border-radius:9px; background:var(--raised-2);
            border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
            color:var(--muted); flex-shrink:0; }
  .plate-top .pn { font-size:14.5px; font-weight:600; }
  .plate-top .pt { font-family:var(--mono); font-size:10px; color:var(--faint); letter-spacing:.06em;
            text-transform:uppercase; margin-top:2px; }
  .sharechip { margin-left:auto; font-family:var(--mono); font-size:9px; letter-spacing:.12em;
            text-transform:uppercase; border-radius:100px; padding:3px 9px; flex-shrink:0; }
  .sharechip.commons { border:1px solid var(--accent); color:var(--accent); background:var(--accent-soft); }
  .sharechip.mine { border:1px solid var(--gold-line); color:var(--gold); background:var(--gold-soft); }
  .plate-reg { font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-top:10px;
            display:flex; flex-wrap:wrap; gap:5px 10px; font-variant-numeric:tabular-nums; }
  .modes { display:flex; gap:5px; margin-top:11px; flex-wrap:wrap; }
  .modechip { font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase;
            border:1px solid var(--border); border-radius:100px; padding:2px 8px; color:var(--faint); }
  .modechip.on { border-color:color-mix(in srgb,var(--accent) 45%,transparent); color:var(--accent);
            background:var(--accent-soft); }
  .plate-actions { display:flex; gap:7px; margin-top:13px; flex-wrap:wrap; align-items:center; }
  .sched { font-family:var(--mono); font-size:11px; background:var(--raised); color:var(--muted);
            border:1px solid var(--border); border-radius:var(--r-sm); padding:7px 9px; cursor:pointer;
            appearance:none; }
  .sched:hover { border-color:var(--accent); color:var(--accent); }
  .plate-msg { font-family:var(--mono); font-size:10.5px; margin-top:9px; color:var(--muted);
            white-space:pre-wrap; line-height:1.45; }
  .plate-msg.ok { color:var(--accent); } .plate-msg.err { color:var(--danger); }

  .typegrid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .typecard { background:var(--raised); border:1px solid var(--border-soft); border-radius:var(--r-sm);
            padding:12px 13px; cursor:pointer; text-align:left; color:var(--text); transition:.14s; }
  .typecard:hover { border-color:var(--accent); background:var(--raised-2); }
  .typecard .tl { font-weight:600; font-size:13px; }
  .typecard .tb { font-size:11px; color:var(--muted); margin-top:4px; line-height:1.45; }
  .crumb { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
            color:var(--muted); background:none; border:none; cursor:pointer; padding:0; margin-bottom:14px;
            display:inline-flex; align-items:center; gap:7px; }
  .crumb:hover { color:var(--accent); }

  /* ---- responsive -------------------------------------------- */
  @media (max-width:900px) {
    .app { grid-template-columns:1fr; }
    .rail { position:fixed; top:56px; bottom:0; left:0; width:296px; z-index:7;
            transform:translateX(-102%); transition:transform .2s; }
    .rail.open { transform:none; box-shadow:var(--shadow); }
    .rail-toggle { display:inline-flex !important; }
    .thread { padding:20px 16px 10px; }
    .composer-wrap { padding:12px 16px 18px; }
    .empty h1 { font-size:25px; }
  }
  .rail-toggle { display:none; }
  @media (min-width:901px) { .rail-scrim { display:none; } }
  .rail-scrim { position:fixed; inset:56px 0 0 0; background:rgba(6,10,12,.5); z-index:6; opacity:0;
            pointer-events:none; transition:.2s; }
  .rail-scrim.open { opacity:1; pointer-events:auto; }
</style>
</head>
<body>
<div class="topbar">
  <button class="icon-btn rail-toggle" id="rail-toggle" aria-label="Menu">
    <svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <span class="brand"><span class="brand-dot"></span>QuickJoiner</span>
  <span class="org-tag" id="org-tag">—</span>
  <span class="model-tag" id="model-tag"></span>
  <div class="top-actions">
    <button class="icon-btn" id="theme-btn" aria-label="Toggle theme" title="Toggle light/dark">
      <svg class="ico" id="theme-ico" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    </button>
    <button class="icon-btn" id="gear" aria-haspopup="dialog" aria-label="Settings" title="Settings">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
  </div>
</div>

<div class="app">
  <div class="rail-scrim" id="rail-scrim"></div>
  <aside class="rail" id="rail">
    <div class="memory">
      <div class="m-label">Learned memory</div>
      <div class="m-nums"><span class="m-big" id="mem-docs">0</span><span class="m-unit">docs</span>
        <span class="m-big" id="mem-chunks" style="margin-left:12px">0</span><span class="m-unit">chunks</span></div>
      <div class="m-sub">from <span class="sourcecount" id="mem-sources">0</span>&nbsp;connected system(s)</div>
    </div>

    <div class="rail-sec">
      <div class="eyebrow">Project</div>
      <div class="select-wrap">
        <select id="project" aria-label="Active project"><option value="">All memory · no project</option></select>
      </div>
      <form class="mini-form" id="project-form">
        <input class="mini-input" id="project-name" placeholder="New project" autocomplete="off">
        <button class="chip-btn" type="submit">Add</button>
      </form>
    </div>

    <div class="rail-sec">
      <div class="eyebrow">Conversations</div>
      <div id="convs"></div>
      <div class="row">
        <button class="chip-btn primary full" id="new-conv" type="button">
          <svg class="ico" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg>New</button>
        <button class="chip-btn" id="distill" type="button" disabled
          title="Extract a summary and durable facts from this conversation into memory">Save</button>
      </div>
    </div>

    <div class="rail-sec">
      <div class="eyebrow">Connected systems
        <button class="link" id="rail-manage" type="button">Manage
          <svg class="ico" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div id="sources"></div>
    </div>
  </aside>

  <section class="canvas">
    <div class="thread"><div class="thread-inner" id="thread"></div></div>
    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Ask about this organization…" autocomplete="off"></textarea>
        <button class="send" id="send" type="submit" aria-label="Ask">
          <svg class="ico" viewBox="0 0 24 24"><path d="M7 11l5-5 5 5M12 6v13"/></svg>
        </button>
      </form>
      <div class="composer-note">Answers are grounded in learned memory and <b>cite their sources</b> — or say what hasn't been learned yet.</div>
    </div>
  </section>
</div>

<div id="backdrop"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="drawer-head">
    <span class="dh-ic"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></span>
    <span class="t">Settings</span>
    <button class="icon-btn x" id="drawer-close" aria-label="Close settings">
      <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="drawer-body">
    <div class="drawer-status" id="drawer-status" aria-live="polite"></div>
    <div><div class="sec-title">Account</div><div id="account"></div></div>
    <div><div class="sec-title">Workspace</div><div id="settings"></div></div>
    <div><div class="sec-title">Connectors</div><div id="connectors"></div></div>
  </div>
</aside>

<script>
/* ============ helpers ============ */
const $ = (id) => document.getElementById(id);
const thread = $("thread");
const composer = $("composer");
const input = $("input");
const send = $("send");
const projectSel = $("project");
const convsEl = $("convs");
const distillBtn = $("distill");
let sessionId = null, currentProject = "", knowledge = {documents:0, sources:0};

const now = () => new Date().toTimeString().slice(0,5);
const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls)n.className=cls;
  if(html!=null)n.innerHTML=html; return n; };

/* auth: bearer token in localStorage; absent = anonymous / open mode */
const TOKEN_KEY="qj_token", USER_KEY="qj_user";
const authHeaders = () => { const t=localStorage.getItem(TOKEN_KEY); return t?{"Authorization":"Bearer "+t}:{}; };
const apiFetch = (path, opts={}) => fetch(path,{...opts, headers:{...(opts.headers||{}),...authHeaders()}});

/* ============ theme ============ */
function applyTheme(mode){
  const root=document.documentElement;
  if(mode==="dark"||mode==="light") root.setAttribute("data-theme",mode);
  else root.removeAttribute("data-theme");
  const dark = mode==="dark" || (mode!=="light" && matchMedia("(prefers-color-scheme:dark)").matches);
  $("theme-ico").innerHTML = dark
    ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>';
}
let themeMode = localStorage.getItem("qj_theme") || "system";
applyTheme(themeMode);
$("theme-btn").onclick = () => {
  const attr = document.documentElement.getAttribute("data-theme");
  const effectiveDark = attr ? attr==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  themeMode = effectiveDark ? "light" : "dark";  // always flip what's on screen
  localStorage.setItem("qj_theme", themeMode); applyTheme(themeMode);
};

/* ============ mobile rail ============ */
const rail=$("rail"), railScrim=$("rail-scrim");
const closeRail=()=>{rail.classList.remove("open");railScrim.classList.remove("open");};
$("rail-toggle").onclick=()=>{rail.classList.toggle("open");railScrim.classList.toggle("open");};
railScrim.onclick=closeRail;

/* ============ message rendering ============ */
function addMsg(role, who){
  const m = el("div","msg "+role);
  const av = role==="user" ? "you" : (role==="agent"?"QJ":"·");
  m.innerHTML = `<div class="avatar">${av}</div><div class="msg-body">
    <div class="who"><span>${who}</span><span class="ts">${now()}</span></div></div>`;
  thread.appendChild(m);
  scrollDown();
  return { root:m, body:m.querySelector(".msg-body") };
}
function scrollDown(){ const t=thread.parentElement; t.scrollTop=t.scrollHeight; }
function sysNote(text){
  const m = addMsg("agent","system");
  m.body.appendChild(el("div","answer",esc(text)));
}

const REFUSAL = /haven'?t learned|not (yet )?learned|don'?t (yet )?have|no.*(learned|in memory)/i;
function renderAnswer(container, text){
  const refused = REFUSAL.test(text.slice(0,140));
  const ans = el("div","answer"+(refused?" refused":""));
  const tag = el("div", "grounded-tag"+(refused?" refused-tag":""));
  let n=0;
  const html = esc(text).replace(/\[([^\[\]\n]{2,200}?)\]/g,(_,ref)=>{
    n++; const isUrl=/^https?:\/\//.test(ref);
    const inner=`<span class="cn">${n}</span><span class="ct">${ref}</span>`;
    return isUrl
      ? `<a class="cite" href="${ref}" target="_blank" rel="noopener" title="${ref}">${inner}</a>`
      : `<span class="cite" title="${ref}">${inner}</span>`;
  });
  ans.innerHTML = html;
  tag.innerHTML = refused
    ? '<svg class="ico" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M12 8v4M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg>Not learned yet'
    : (n?`<svg class="ico" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M20 6 9 17l-5-5"/></svg>Grounded · ${n} source${n>1?"s":""}`
        :'<svg class="ico" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M20 6 9 17l-5-5"/></svg>Grounded');
  const wrap = el("div");
  if(refused || n){ ans.style.marginTop="8px"; wrap.appendChild(tag); }
  wrap.appendChild(ans);
  container.appendChild(wrap);
}

/* ============ status / memory ============ */
async function loadMeta(){
  try{
    const s = await (await apiFetch("/api/status")).json();
    $("org-tag").textContent = s.org;
    $("model-tag").textContent = `${s.llm.provider} · ${s.llm.model}`;
    $("mem-docs").textContent = s.stats.documents;
    $("mem-chunks").textContent = s.stats.chunks;
    $("mem-sources").textContent = s.stats.sources;
    knowledge = {documents:s.stats.documents, sources:s.stats.sources};
    if(!sessionId && !thread.children.length) welcome();
  }catch{ $("org-tag").textContent="offline"; }
}

/* ============ sources (rail glance) ============ */
async function loadSources(){
  const box=$("sources");
  try{
    const sources = await (await apiFetch("/api/sources")).json();
    box.innerHTML="";
    const configured = sources.filter(s=>s.configured);
    if(!configured.length){
      box.appendChild(el("div","hint","Nothing connected yet. Open <b>Manage</b> to add a system, "
        +"or teach a fact with <code>qj learn</code>."));
      return;
    }
    for(const s of configured){
      const row=el("div","sys-item");
      row.innerHTML=`<span class="sys-dot"></span><span class="s-name">${esc(s.name)}</span>
        <span class="s-meta">${s.documents}</span>`;
      row.title = `${s.type} · ${s.documents} docs`;
      box.appendChild(row);
    }
  }catch{ box.textContent="unavailable"; }
}

/* ============ projects ============ */
async function loadProjects(selectId){
  try{
    const projects = await (await apiFetch("/api/projects")).json();
    projectSel.innerHTML='<option value="">All memory · no project</option>';
    for(const p of projects){
      const o=el("option"); o.value=p.id; o.textContent=`${p.name} (${p.session_count})`;
      projectSel.appendChild(o);
    }
    projectSel.value = selectId!==undefined ? selectId : currentProject;
  }catch{}
}
projectSel.onchange=()=>{ currentProject=projectSel.value; newConversation(); };
$("project-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const name=$("project-name").value.trim(); if(!name)return;
  try{
    const p = await (await apiFetch("/api/projects",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({name})})).json();
    $("project-name").value=""; currentProject=p.id; await loadProjects(p.id); newConversation();
  }catch(e){ sysNote("could not create project: "+e); }
});

/* ============ conversations ============ */
async function loadConvs(){
  try{
    const url="/api/sessions"+(currentProject?"?project="+encodeURIComponent(currentProject):"");
    const rows=(await (await apiFetch(url)).json()).filter(s=>s.title||s.est_tokens>0);
    convsEl.innerHTML="";
    if(!rows.length){ convsEl.appendChild(el("div","hint","No conversations yet — ask something below."));
      return; }
    for(const s of rows.slice(0,24)){
      const item=el("div","chat-item"+(s.id===sessionId?" active":""));
      const proj = s.project_id&&!currentProject ? `<span class="proj">${esc(s.project_id)}</span> · ` : "";
      item.innerHTML=`<div class="ci-t">${esc(s.title||"(untitled)")}</div>
        <div class="ci-m">${proj}${s.updated_at.slice(0,16).replace("T"," ")} · ~${s.est_tokens} tok</div>`;
      item.onclick=()=>{ openSession(s.id); closeRail(); };
      convsEl.appendChild(item);
    }
  }catch{ convsEl.textContent="unavailable"; }
}
async function openSession(id){
  try{
    const s=await (await apiFetch("/api/sessions/"+encodeURIComponent(id))).json();
    sessionId=s.id; distillBtn.disabled=false;
    if((s.project_id||"")!==currentProject){ currentProject=s.project_id||""; projectSel.value=currentProject; }
    thread.innerHTML="";
    if(s.summary) memoBlock(s.summary);
    for(const m of s.messages){
      if(m.role==="tool"||!m.content) continue;
      const e=addMsg(m.role==="user"?"user":"agent", m.role==="user"?"you":"QJ");
      e.body.querySelector(".ts").textContent="";
      if(m.role==="user") e.body.appendChild(el("div","user-text",esc(m.content)));
      else renderAnswer(e.body, m.content);
    }
    loadConvs(); input.focus();
  }catch(e){ sysNote("could not open conversation: "+e); }
}
function memoBlock(summary){
  const d=el("details","memo","<summary>Older turns condensed into memory</summary><pre></pre>");
  d.querySelector("pre").textContent=summary;
  thread.insertBefore(d, thread.firstChild);
}
function newConversation(){

/* ============ composer ============ */
function autoGrow(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,180)+"px"; }
input.addEventListener("input", autoGrow);
input.addEventListener("keydown",(e)=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); composer.requestSubmit(); }
});

composer.addEventListener("submit", async (e)=>{
  e.preventDefault();
  const message=input.value.trim(); if(!message)return;
  const first = thread.querySelector(".empty"); if(first) thread.innerHTML="";
  const q=addMsg("user","you"); q.body.appendChild(el("div","user-text",esc(message)));
  input.value=""; autoGrow(); send.disabled=true;

  const a=addMsg("agent","QJ");
  let think=null, answerText="", answerEl=null, tools=null;
  const streamAns=()=>{ if(!answerEl){ answerEl=el("div","answer streaming"); a.body.appendChild(answerEl);} return answerEl; };
  try{
    const resp=await fetch("/api/chat",{method:"POST",
      headers:{"Content-Type":"application/json",...authHeaders()},
      body:JSON.stringify({message, session_id:sessionId, project:currentProject||null})});
    const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf="";
    while(true){
      const {done,value}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split("\n\n"); buf=parts.pop();
      for(const evt of parts){
        if(!evt.startsWith("data: "))continue;
        const p=JSON.parse(evt.slice(6));
        if(p.type==="thinking"){
          if(!think){ think=el("details","think","<summary>Reasoning</summary><pre></pre>"); think.open=true;
            a.body.insertBefore(think,a.body.firstChild); }
          const pre=think.querySelector("pre"); pre.textContent+=p.data; pre.scrollTop=pre.scrollHeight;
        } else if(p.type==="tool_call"){
          if(!tools){ tools=el("div","tools"); a.body.insertBefore(tools, think?think.nextSibling:a.body.firstChild); }
          const c=el("span","toolchip"); c.title=p.data; c.textContent=p.data; tools.appendChild(c);
        } else if(p.type==="delta"){
          answerText+=p.data; streamAns().textContent=answerText; scrollDown();
        } else if(p.type==="answer"){
          sessionId=p.session_id;
          if(answerEl){ answerEl.remove(); answerEl=null; }
          renderAnswer(a.body, p.data);
        } else if(p.type==="error"){
          a.root.classList.add("error");
          if(answerEl){answerEl.remove();answerEl=null;}
          a.body.appendChild(el("div","answer","Could not answer: "+esc(p.data)));
        }
      }
    }
  }catch(err){
    a.root.classList.add("error"); a.body.appendChild(el("div","answer","Request failed: "+esc(String(err))));
  }finally{
    if(answerEl) answerEl.classList.remove("streaming");
    if(think) think.open=false;
    send.disabled=false; distillBtn.disabled=!sessionId; loadConvs(); loadMeta(); input.focus();
  }
});

async function doLogin(u,p){
  const resp=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:u,password:p})});
  const d=await resp.json();
  if(!resp.ok){ dStatus(d.detail||"Sign-in failed","err"); return false; }
  localStorage.setItem(TOKEN_KEY,d.token); localStorage.setItem(USER_KEY,d.username);
  dStatus("Signed in as "+d.username,"ok"); return true;
}
async function createUser(u,p,thenLogin){
  const resp=await apiFetch("/api/auth/users",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:u,password:p})});
  const d=await resp.json();
  if(!resp.ok){ dStatus(d.detail||"Could not create user","err"); return; }
  if(thenLogin) await doLogin(u,p); else dStatus(`User ${u} created`,"ok");
  refreshDrawer(); loadSources();
}

    +`<div class="btn-row"><button class="chip-btn primary" type="submit">Test &amp; save</button>
      <button class="chip-btn" type="button" id="cf-skip">Save without testing</button></div>
      <div class="plate-msg" id="cf-msg"></div>`;
  const submit=async(skip)=>{
    const name=form.querySelector("#cf-name").value.trim();
    const msg=form.querySelector("#cf-msg");
    const fail=(t)=>{ msg.textContent=t; msg.className="plate-msg err"; };
    if(!name) return fail("Give this connector a name.");
    const options={};
    for(const f of t.fields){ let v=form.querySelector(`#cf-${f.key}`).value.trim();
      if(!v){ if(f.required) return fail(`${f.label} is required.`); continue; }
      options[f.key]= f.list&&v.includes(",") ? v.split(",").map(s=>s.trim()) : v; }
    msg.textContent=skip?"saving…":"testing connection…"; msg.className="plate-msg";
    const syncVal=form.querySelector("#cf-sync").value;
    const resp=await apiFetch("/api/connectors",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,type:t.type,options,skip_test:skip,
        sync_interval_minutes:syncVal?Number(syncVal):null,
        shared:canShare?form.querySelector("#cf-share").checked:true})});
    const d=await resp.json();
    if(!resp.ok) return fail(d.detail||"Could not save");
    dStatus(`Connected ${name}. Sync it to start learning.`,"ok"); renderConnectors(); loadSources(); loadMeta();
  };
  form.addEventListener("submit",(e)=>{ e.preventDefault(); submit(false); });
  form.querySelector("#cf-skip").onclick=()=>submit(true);
  connectorsEl.appendChild(form); form.querySelector("#cf-name").focus();
}
