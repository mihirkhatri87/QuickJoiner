[project]
name = "quickjoiner"
version = "0.1.0"
description = "Onboarding intelligence system for new-joinee principal engineers: learns an org's tools, code, processes, and roadmaps, and answers only from learned knowledge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "httpx>=0.27",
    # Upper bound is load-bearing, not caution. LanceDB 0.38 parses a DOUBLE-QUOTED string in
    # a filter predicate as an identifier rather than a literal, so every `table.delete(f'doc_id
    # = "{id}"')` and every scope predicate in memory/store.py raises `No field named "…"`.
    # Measured 2026-08-15: 58 tests fail, 11 error on 0.38 and all pass on 0.37.1. The floor had
    # no ceiling, so a fresh `pip install` on a machine without a preinstalled LanceDB got a
    # broken install. Raise this only together with switching those predicates to single quotes
    # (with proper escaping — see test_scoping's quote-injection case).
    "lancedb>=0.15,<0.38",
    "fastembed>=0.5",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "apscheduler>=3.10",
    "markdown>=3.6",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    # Encrypts each user's skill credentials at rest (quickjoiner/skills/secrets.py). A core
    # dependency, not an extra: without it a user-scoped skill cannot store a value at all.
    "cryptography>=42.0",
    # The IANA time-zone database `zoneinfo` reads. Windows ships no tz database at all, so
    # without this `chat.timezone` silently degrades to UTC and every "last Friday" is off by
    # the local offset (quickjoiner/agent/dates.py resolves calendar days in the local zone).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.45"]
# Cloud mode: Postgres catalog + pgvector store (selected at runtime by DATABASE_URL).
cloud = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]

[project.scripts]
qj = "quickjoiner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quickjoiner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
