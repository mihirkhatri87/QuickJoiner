[project]
name = "quickjoiner"
version = "0.1.0"
description = "Onboarding intelligence system for new-joinee principal engineers: learns an org's tools, code, processes, and roadmaps, and answers only from learned knowledge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "httpx>=0.27",
    "lancedb>=0.15",
    "fastembed>=0.5",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "apscheduler>=3.10",
    "markdown>=3.6",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.45"]
# Cloud mode: Postgres catalog + pgvector store (selected at runtime by DATABASE_URL).
cloud = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]

[project.scripts]
qj = "quickjoiner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quickjoiner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
