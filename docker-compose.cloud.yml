# Cloud-mode stack for local development: QuickJoiner + Postgres (with pgvector).
# Setting DATABASE_URL flips the app from SQLite/LanceDB (files) to Postgres/pgvector
# (shared), which is the multi-container/AWS path. Build image with the cloud extra.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: quickjoiner
      POSTGRES_PASSWORD: quickjoiner
      POSTGRES_DB: quickjoiner
    ports:
      - "5432:5432"
    volumes:
      - qj-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickjoiner"]
      interval: 5s
      timeout: 3s
      retries: 10

  quickjoiner:
    build:
      context: .
      # cloud mode needs psycopg — install the cloud extra into the image
      args:
        EXTRAS: "cloud"
    image: quickjoiner:cloud
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8787:8787"
    environment:
      # Presence of DATABASE_URL selects the Postgres catalog + pgvector store.
      DATABASE_URL: "postgresql://quickjoiner:quickjoiner@db:5432/quickjoiner"
      QJ_PROVIDER: ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  qj-pgdata:
